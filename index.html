<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 플래시 카드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; color: #2d3748;
}
.app { width: 100%; max-width: 720px; }
.header { text-align: center; margin-bottom: 24px; color: #fff; }
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.header p { font-size: 14px; opacity: 0.85; }
.progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.25); border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
.progress-fill { height: 100%; background: #fff; border-radius: 99px; transition: width 0.3s ease; width: 0%; }
.counter { text-align: center; color: #fff; font-size: 14px; margin-bottom: 16px; font-weight: 500; opacity: 0.9; }
.card-wrap { perspective: 1500px; margin-bottom: 24px; }
.card { position: relative; width: 100%; height: 360px; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.card-face { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border-radius: 24px; padding: 32px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); text-align: center; overflow: auto; }
.card-front { background: #fff; }
.card-back { background: linear-gradient(135deg, #ffeaa7 0%, #fab1a0 100%); transform: rotateY(180deg); }
.card-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #718096; margin-bottom: 20px; }
.card-back .card-label { color: #c0392b; }
.card-content { font-size: 22px; font-weight: 500; line-height: 1.6; color: #1a202c; word-break: keep-all; }
.card-back .card-content { font-size: 28px; font-weight: 700; color: #2d3436; }
.tap-hint { position: absolute; bottom: 16px; font-size: 11px; color: #a0aec0; }
.card-back .tap-hint { color: #b04a3a; }
.controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.btn { padding: 14px 16px; border: none; border-radius: 14px; background: rgba(255,255,255,0.95); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; color: #2d3748; font-family: inherit; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.18); }
.btn-primary { background: #2d3748; color: #fff; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.chip { padding: 8px 14px; background: rgba(255,255,255,0.18); color: #fff; border: 1px solid rgba(255,255,255,0.35); border-radius: 99px; font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 500; }
.chip:hover { background: rgba(255,255,255,0.3); }
.kbd-hint { text-align: center; color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 18px; }
.kbd-hint kbd { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 4px; padding: 2px 6px; font-family: ui-monospace, monospace; font-size: 11px; margin: 0 2px; }
@media (max-width: 480px) {
  .header h1 { font-size: 22px; }
  .card { height: 320px; }
  .card-content { font-size: 18px; }
  .card-back .card-content { font-size: 24px; }
  .btn { padding: 12px 8px; font-size: 13px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>한국사 플래시 카드</h1>
    <p>카드를 탭하여 정답 확인</p>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div class="counter" id="counter">로딩 중...</div>
  <div class="card-wrap">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="card-label">질문</div>
        <div class="card-content" id="question">로딩 중...</div>
        <div class="tap-hint">탭하여 정답 보기</div>
      </div>
      <div class="card-face card-back">
        <div class="card-label">정답</div>
        <div class="card-content" id="answer"></div>
        <div class="tap-hint">탭하여 질문 보기</div>
      </div>
    </div>
  </div>
  <div class="controls">
    <button class="btn" id="prevBtn">← 이전</button>
    <button class="btn btn-primary" id="flipBtn">뒤집기</button>
    <button class="btn" id="nextBtn">다음 →</button>
  </div>
  <div class="toolbar">
    <button class="chip" id="shuffleBtn">🔀 섞기</button>
    <button class="chip" id="resetBtn">↺ 원래 순서</button>
    <button class="chip" id="autoBtn">▶ 자동재생</button>
    <button class="chip" id="randBtn">🎲 랜덤</button>
  </div>
  <div class="kbd-hint">
    <kbd>←</kbd> <kbd>→</kbd> 이동 &nbsp; <kbd>Space</kbd> 뒤집기 &nbsp; <kbd>S</kbd> 섞기
  </div>
</div>
<script>
(function() {
  var ORIGINAL = [{"q": "구석기 시대의 사람들이 도구를 만들기 위해 돌을 깨뜨려 만든 도구의 명칭은?", "a": "뗀석기"}, {"q": "신석기 시대에 농경이 시작되고 정착 생활을 하면서 사용하기 시작한 토기는?", "a": "빗살무늬토기"}, {"q": "청동기 시대의 권력과 계급 발생을 보여주는 대표적인 무덤 양식은?", "a": "고인돌"}, {"q": "우리 역사 최초의 국가인 고조선이 건국된 시기는?", "a": "기원전 2333년"}, {"q": "고조선 8조법 중 '사람을 죽인 자는 즉시 사형에 처한다'는 조항이 강조하는 가치는?", "a": "생명 존중"}, {"q": "고조선 8조법 중 '남을 다치게 한 자는 곡식으로 갚는다'는 조항을 통해 알 수 있는 사회적 특징은?", "a": "농경 사회 및 사유 재산의 존재"}, {"q": "고조선 8조법 중 '도둑질을 한 자는 노비로 삼는다'는 조항을 통해 알 수 있는 사회적 특징은?", "a": "계급 사회 및 사유 재산의 존재"}, {"q": "고조선이 한 무제의 공격을 받아 멸망한 시기는?", "a": "기원전 108년"}, {"q": "부여에서 12월에 열린 제천 행사의 이름은?", "a": "영고"}, {"q": "부여의 특징적인 정치 체제로 마가, 우가, 저가, 구가가 나누어 다스리던 지역은?", "a": "사출도"}, {"q": "부여에서 왕이 죽었을 때 신하 등을 함께 묻던 풍습은?", "a": "순장"}, {"q": "고구려에서 10월에 열린 제천 행사의 이름은?", "a": "동맹"}, {"q": "고구려의 혼인 풍습으로 신랑이 신부의 집 뒤편에 마련된 집에 머무는 제도는?", "a": "서옥제(데릴사위제)"}, {"q": "옥저에서 어린 여자아이를 데려다 키운 후 혼인시키는 풍습은?", "a": "민며느리제"}, {"q": "동예에서 다른 부족의 영역을 침범했을 때 가축이나 노비로 보상하게 한 제도는?", "a": "책화"}, {"q": "동예에서 10월에 열린 제천 행사의 이름은?", "a": "무천"}, {"q": "삼한에서 제사장인 천군이 다스리던 신성 지역의 명칭은?", "a": "소도"}, {"q": "고구려 광개토대왕이 정복 활동 외에 신라에 침입한 왜를 격퇴하며 영향력을 행사한 시기는?", "a": "4세기 말~5세기 초"}, {"q": "고구려 장수왕이 427년에 수도를 옮기며 본격적인 남하 정책을 펼친 곳은?", "a": "평양"}, {"q": "백제의 4세기 전성기를 이끌며 고구려 평양성을 공격하고 마한을 정복한 왕은?", "a": "근초고왕"}, {"q": "백제 무령왕이 지방을 통제하기 위해 주요 요충지에 설치한 행정 구역은?", "a": "22담로"}, {"q": "백제 성왕이 수도를 사비로 옮기며 변경한 국호는?", "a": "남부여"}, {"q": "신라 지증왕이 정복한 오늘날의 울릉도와 그 주변 섬을 지칭하는 명칭은?", "a": "우산국"}, {"q": "신라 법흥왕이 이차돈의 순교를 계기로 국가적으로 공인한 종교는?", "a": "불교"}, {"q": "신라 진흥왕이 한강 유역을 차지한 후 세운 비석과 정비한 청소년 조직은?", "a": "순수비, 화랑도"}, {"q": "가야 연맹의 후기 주도권을 잡았던 지역과 국가의 이름은?", "a": "고령의 대가야"}, {"q": "신라 무열왕(김춘추)이 삼국 통일을 위해 당나라와 맺은 동맹은?", "a": "나당 동맹"}, {"q": "신라가 나당 전쟁에서 승리하여 삼국 통일을 완수한 연도는?", "a": "676년"}, {"q": "신문왕이 귀족의 경제적 기반을 약화시키기 위해 폐지한 제도는?", "a": "녹읍"}, {"q": "신문왕이 지방 행정 조직을 정비하며 전국을 나눈 단위는?", "a": "9주 5소경"}, {"q": "발해를 건국한 대조영이 국가를 세운 장소는?", "a": "동모산"}, {"q": "발해 선왕 시기에 영토를 크게 확장하여 당으로부터 불린 별칭은?", "a": "해동성국"}, {"q": "발해가 고구려를 계승했음을 보여주는 외교적 증거 중 하나는?", "a": "일본 외교 문서에 '고려국왕' 명칭 사용"}, {"q": "고려 태조 왕건이 북진 정책의 거점으로 중시한 도시는?", "a": "서경(평양)"}, {"q": "고려 태조가 호족을 포섭하기 위해 자신의 성씨를 하사한 정책은?", "a": "사성 정책"}, {"q": "고려 태조가 호족을 통제하기 위해 자식들을 개경에 머물게 한 제도는?", "a": "기인 제도"}, {"q": "고려 태조 왕건이 민생 안정을 위해 세금을 줄여준 비율은?", "a": "1/10 (10분의 1)"}, {"q": "고려 광종이 억울하게 노비가 된 사람들을 조사하여 해방시킨 정책은?", "a": "노비안검법"}, {"q": "고려 광종이 쌍기의 건의를 받아들여 유교적 소양을 갖춘 관리를 선발한 제도는?", "a": "과거제"}, {"q": "고려 성종 때 최승로가 유교 정치의 이상을 담아 올린 상소문은?", "a": "시무 28조"}, {"q": "거란의 1차 침입 때 서희가 외교 담판을 통해 획득한 영토는?", "a": "강동 6주"}, {"q": "거란의 3차 침입 당시 강감찬이 이끄는 고려군이 거란군을 크게 격파한 전투는?", "a": "귀주 대첩"}, {"q": "여진(금)을 정벌하기 위해 윤관의 건의로 조직된 특수 부대는?", "a": "별무반"}, {"q": "1135년 서경 세력이 개경의 보수적 귀족층에 맞서 일으킨 운동은?", "a": "묘청의 서경 천도 운동"}, {"q": "고려 무신 정권의 최고 권력 기구로 최충헌이 설치한 것은?", "a": "교정도감"}, {"q": "고려 무신 정권의 군사적 기반이자 원나라에 끝까지 항쟁한 군대는?", "a": "삼별초"}, {"q": "몽골의 침입에 맞서 고려 정부가 강화도로 수도를 옮긴 시기의 집권자는?", "a": "최우"}, {"q": "원 간섭기에 고려에 들어온 몽골의 풍습(변발, 호복 등)을 가리키는 말은?", "a": "몽골풍"}, {"q": "공민왕이 반원 자주 정책을 펼치며 무력으로 수복한 지역은?", "a": "쌍성총관부"}, {"q": "공민왕이 신돈을 등용하여 권문세족이 빼앗은 땅과 노비를 되찾아주려 설치한 기구는?", "a": "전민변정도감"}, {"q": "고려 시대 지눌이 선종을 중심으로 교종을 통합하기 위해 주장한 수행법은?", "a": "돈오점수, 정혜쌍수"}, {"q": "현존하는 세계에서 가장 오래된 금속 활자본의 명칭은?", "a": "직지심체요절"}, {"q": "신라의 무덤 중 도굴이 어려워 금관 등 많은 유물이 발견된 양식은?", "a": "돌무지덧널무덤"}, {"q": "고구려와 백제의 무덤 양식 중 내부 벽면에 벽화를 그릴 수 있는 구조는?", "a": "굴식 돌방무덤"}, {"q": "고려 시대 김부식이 유교 사관을 바탕으로 저술한 역사서는?", "a": "삼국사기"}, {"q": "고려 후기 일연이 단군 신화를 포함하여 불교적 관점에서 저술한 역사서는?", "a": "삼국유사"}, {"q": "백제 성왕이 전사한 전투이자 신라가 한강 유역을 독점하게 된 계기가 된 곳은?", "a": "관산성 전투"}, {"q": "고려 성종이 지방관을 파견하기 위해 전국에 설치한 행정 구역은?", "a": "12목"}, {"q": "고려 청자의 대표적인 제작 기법으로 무늬를 파낸 후 다른 색의 흙을 채우는 기법은?", "a": "상감 기법"}, {"q": "신라 신문왕이 전제 왕권을 강화하는 과정에서 숙청한 대표적인 인물은?", "a": "김흠돌"}, {"q": "삼한에서 계절에 따라 하늘에 제사를 지내기 위해 열린 시기는?", "a": "5월(씨뿌리기 후), 10월(추수 후)"}, {"q": "거란의 2차 침입 당시 큰 활약을 펼친 고려의 장수는?", "a": "양규"}, {"q": "고려 최충헌의 사노비로 '신분 해방'을 부르짖으며 반란을 꾀한 인물은?", "a": "만적"}, {"q": "고구려의 전성기 순서에 따른 주요 왕들의 계보는?", "a": "광개토대왕 → 장수왕"}, {"q": "삼국 시대 전성기를 누린 국가의 시간적 순서는?", "a": "백제(4세기) → 고구려(5세기) → 신라(6세기)"}, {"q": "고려 광종이 왕권을 강화하기 위해 사용한 독자적인 연호는?", "a": "광덕, 준풍"}, {"q": "고구려 장수왕이 남하 정책의 결과로 충주 지역에 세운 비석은?", "a": "충주 고구려비"}, {"q": "발해 문왕 시기에 당나라와의 관계 변화는?", "a": "적대 관계에서 친선 관계로 변화"}, {"q": "신라 법흥왕이 국가의 기틀을 마련하기 위해 반포한 법령 체계는?", "a": "율령"}, {"q": "고구려 장수왕의 남하 정책에 대응하기 위해 백제와 신라가 맺은 동맹은?", "a": "나제 동맹"}];
  var cards = ORIGINAL.slice();
  var idx = 0;
  var auto = null;
  var cardEl = document.getElementById("card");
  var qEl = document.getElementById("question");
  var aEl = document.getElementById("answer");
  var counter = document.getElementById("counter");
  var progress = document.getElementById("progress");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var flipBtn = document.getElementById("flipBtn");
  var shuffleBtn = document.getElementById("shuffleBtn");
  var resetBtn = document.getElementById("resetBtn");
  var autoBtn = document.getElementById("autoBtn");
  var randBtn = document.getElementById("randBtn");
  function render() {
    cardEl.classList.remove("flipped");
    setTimeout(function() {
      qEl.textContent = cards[idx].q;
      aEl.textContent = cards[idx].a;
    }, 150);
    counter.textContent = (idx + 1) + " / " + cards.length;
    progress.style.width = ((idx + 1) / cards.length * 100) + "%";
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === cards.length - 1;
  }
  function flip() { cardEl.classList.toggle("flipped"); }
  function next() { if (idx < cards.length - 1) { idx++; render(); } }
  function prev() { if (idx > 0) { idx--; render(); } }
  function rand() { idx = Math.floor(Math.random() * cards.length); render(); }
  function shuffle() {
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = cards[i]; cards[i] = cards[j]; cards[j] = t;
    }
    idx = 0; render();
  }
  function reset() { cards = ORIGINAL.slice(); idx = 0; render(); }
  function toggleAuto() {
    if (auto) { clearInterval(auto); auto = null; autoBtn.textContent = "▶ 자동재생"; }
    else {
      autoBtn.textContent = "⏸ 일시정지";
      var phase = 0;
      auto = setInterval(function() {
        if (phase === 0) { flip(); phase = 1; }
        else {
          if (idx < cards.length - 1) { next(); } else { idx = 0; render(); }
          phase = 0;
        }
      }, 3500);
    }
  }
  cardEl.addEventListener("click", flip);
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  flipBtn.addEventListener("click", function(e) { e.stopPropagation(); flip(); });
  shuffleBtn.addEventListener("click", shuffle);
  resetBtn.addEventListener("click", reset);
  autoBtn.addEventListener("click", toggleAuto);
  randBtn.addEventListener("click", rand);
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") next();
    else if (e.key === "ArrowLeft") prev();
    else if (e.key === " ") { e.preventDefault(); flip(); }
    else if (e.key === "s" || e.key === "S") shuffle();
  });
  render();
})();
</script>
</body>
</html>
